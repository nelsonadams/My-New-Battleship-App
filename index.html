<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battleship</title>
<style>
  :root {
    --bg1: #061a2e; --bg2: #0b3354;
    --water: #0e4c7a; --water-hi: #1665a0;
    --grid: rgba(255,255,255,.12);
    --ship: #8c9aa8; --ship-dark: #5d6a77;
    --hit: #ff4b3e; --miss: #cfe8ff; --sunk: #3a1514;
    --accent: #ffcc33; --text: #e8f1fa; --muted: #8fb0cc;
    --cell: min(4.2vw, 38px);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(ellipse at top, var(--bg2), var(--bg1) 70%);
    display: flex; flex-direction: column; align-items: center;
  }
  header { text-align: center; padding: 18px 10px 4px; }
  h1 { margin: 0; font-size: 2.4rem; letter-spacing: .35em; font-weight: 800;
       text-shadow: 0 0 18px rgba(80,170,255,.6); }
  #status { margin: 8px 0 4px; font-size: 1.15rem; min-height: 1.6em; color: var(--accent); font-weight: 600; text-align: center; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 8px 0 14px; }
  button.btn {
    background: linear-gradient(#1d6fae, #12507f); color: white; border: 1px solid #3c8fd0;
    border-radius: 8px; padding: 8px 16px; font-size: .95rem; cursor: pointer; font-weight: 600;
  }
  button.btn:hover:not(:disabled) { filter: brightness(1.2); }
  button.btn:disabled { opacity: .4; cursor: default; }
  button.btn.primary { background: linear-gradient(#f2b312, #c98a00); border-color: #ffd65c; color: #1a1200; }
  select { background: #0d3a60; color: white; border: 1px solid #3c8fd0; border-radius: 8px; padding: 8px; font-size: .95rem; }
  .boards { display: flex; flex-wrap: wrap; gap: 36px; justify-content: center; align-items: flex-start; padding: 0 10px; }
  .board-wrap { display: flex; flex-direction: column; align-items: center; }
  .board-wrap h2 { margin: 0 0 6px; font-size: 1.05rem; letter-spacing: .2em; color: var(--muted); }
  .board-wrap.active h2 { color: var(--accent); }
  .board {
    display: grid; grid-template-columns: calc(var(--cell) * .7) repeat(10, var(--cell));
    grid-template-rows: calc(var(--cell) * .7) repeat(10, var(--cell));
    user-select: none;
  }
  .label { display: flex; align-items: center; justify-content: center; font-size: .75rem; color: var(--muted); font-weight: 600; }
  .cell {
    position: relative; border: 1px solid var(--grid);
    background: linear-gradient(135deg, var(--water), #0b4069);
  }
  .board.target .cell.open { cursor: crosshair; }
  .board.target.enabled .cell.open:hover { background: var(--water-hi); box-shadow: inset 0 0 0 2px var(--accent); }
  .board.placing .cell { cursor: pointer; }
  .cell.ship { background: linear-gradient(135deg, var(--ship), var(--ship-dark)); border-color: #46525e; }
  .cell.ship.h-start { border-radius: 40% 0 0 40%; } .cell.ship.h-end { border-radius: 0 40% 40% 0; }
  .cell.ship.v-start { border-radius: 40% 40% 0 0; } .cell.ship.v-end { border-radius: 0 0 40% 40%; }
  .cell.preview-ok { background: rgba(120,230,140,.55); }
  .cell.preview-bad { background: rgba(255,80,80,.5); }
  .cell.sunk { background: linear-gradient(135deg, #5a2220, var(--sunk)) !important; }
  .cell.miss::after {
    content: ""; position: absolute; inset: 35%; border-radius: 50%; background: var(--miss); opacity: .85;
    animation: pop .35s ease-out;
  }
  .cell.hit::after {
    content: "✕"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--hit); font-weight: 900; font-size: calc(var(--cell) * .7); text-shadow: 0 0 8px #ff7a00;
    animation: boom .45s ease-out;
  }
  .cell.last { box-shadow: inset 0 0 0 2px var(--accent); }
  @keyframes pop { from { transform: scale(2.2); opacity: 0; } to { transform: scale(1); } }
  @keyframes boom { 0% { transform: scale(2.6); color: #fff27a; } 100% { transform: scale(1); } }
  .explosion { position: absolute; left: 50%; top: 50%; width: 0; height: 0; z-index: 5; pointer-events: none; }
  .explosion .core {
    position: absolute; left: calc(var(--cell) * -.6); top: calc(var(--cell) * -.6);
    width: calc(var(--cell) * 1.2); height: calc(var(--cell) * 1.2); border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, #fff27a 20%, #ffb020 42%, #ff4b1f 65%, rgba(120,20,0,0) 72%);
    animation: fireball .7s ease-out forwards;
  }
  .explosion .ring {
    position: absolute; left: calc(var(--cell) * -.5); top: calc(var(--cell) * -.5);
    width: calc(var(--cell) * 1); height: calc(var(--cell) * 1); border-radius: 50%;
    border: 3px solid rgba(255,220,120,.9); animation: shock .55s ease-out forwards;
  }
  .explosion .smoke {
    position: absolute; left: calc(var(--cell) * -.45); top: calc(var(--cell) * -.45);
    width: calc(var(--cell) * .9); height: calc(var(--cell) * .9); border-radius: 50%;
    background: radial-gradient(circle, rgba(70,70,70,.8), rgba(40,40,40,0) 70%);
    animation: smoke 1s ease-out .15s forwards; opacity: 0;
  }
  .explosion .spark {
    position: absolute; left: -3px; top: -3px; width: 6px; height: 6px; border-radius: 50%;
    background: #ffd447; box-shadow: 0 0 6px #ff8a00; animation: spark .6s ease-out forwards;
  }
  .explosion.big .core, .explosion.big .ring, .explosion.big .smoke { scale: 1.8; }
  @keyframes fireball { 0% { transform: scale(.2); opacity: 1; } 40% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }
  @keyframes shock { 0% { transform: scale(.3); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }
  @keyframes smoke { 0% { transform: scale(.5) translateY(0); opacity: .8; } 100% { transform: scale(1.6) translateY(calc(var(--cell) * -.6)); opacity: 0; } }
  @keyframes spark { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; } }
  #cinema { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; align-items: center; justify-content: center; z-index: 20; cursor: pointer; }
  #cinema.show { display: flex; animation: fadein .25s ease-out; }
  #cinema canvas { width: min(720px, 94vw); aspect-ratio: 16 / 9; border-radius: 10px; box-shadow: 0 10px 60px rgba(0,0,0,.8); border: 2px solid #333; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  /* ---------- Victory Royale ---------- */
  #victory { position: fixed; inset: 0; z-index: 30; display: none; overflow: hidden; align-items: center; justify-content: center; flex-direction: column;
             background: radial-gradient(circle at 50% 40%, #3d7bff 0%, #1d3fb8 35%, #160f5c 75%, #090530 100%); }
  #victory.show { display: flex; animation: fadein .3s ease-out; }
  #victory .rays { position: absolute; left: 50%; top: 40%; width: 260vmax; height: 260vmax; margin: -130vmax 0 0 -130vmax;
    background: repeating-conic-gradient(rgba(255,255,255,.13) 0deg 7deg, rgba(255,255,255,0) 7deg 18deg);
    animation: spin 40s linear infinite; pointer-events: none; }
  #victory .glow { position: absolute; left: 50%; top: 40%; width: 70vmin; height: 70vmin; margin: -35vmin 0 0 -35vmin; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,240,170,.55), rgba(255,200,60,0) 65%); animation: pulse 2s ease-in-out infinite; pointer-events: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.12); opacity: 1; } }
  .vr-title { position: relative; text-align: center; font-weight: 900; transform: skewX(-8deg) rotate(-3deg); font-family: Impact, "Arial Black", "Segoe UI Black", sans-serif;
    text-transform: uppercase; line-height: .9; animation: slam .7s cubic-bezier(.2, 1.6, .4, 1) both .15s; }
  .vr-num { font-size: clamp(60px, 13vw, 150px); }
  .vr-victory { font-size: clamp(70px, 16vw, 200px); letter-spacing: .02em; }
  .vr-gold { background: linear-gradient(#fffbe0 0%, #ffe46b 35%, #ffb400 70%, #ff8a00 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 2px #1b1260) drop-shadow(0 6px 0 #1b1260) drop-shadow(0 10px 18px rgba(0,0,0,.5)); }
  .vr-royale { display: inline-block; margin-top: 4px; padding: 6px 48px 2px; font-size: clamp(34px, 7vw, 86px); letter-spacing: .12em; color: #fff;
    background: linear-gradient(90deg, rgba(120,60,255,0), #8a3cff 15%, #c13cff 50%, #8a3cff 85%, rgba(120,60,255,0));
    text-shadow: 0 4px 0 #2a0d6b, 0 0 20px rgba(255,255,255,.4); animation: banner .5s ease-out both .75s; }
  @keyframes slam { 0% { transform: skewX(-8deg) rotate(-3deg) scale(4); opacity: 0; } 60% { opacity: 1; } 100% { transform: skewX(-8deg) rotate(-3deg) scale(1); opacity: 1; } }
  @keyframes banner { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
  .vr-stats { position: relative; display: flex; gap: 14px; margin-top: 34px; flex-wrap: wrap; justify-content: center; animation: rise .5s ease-out both 1.2s; }
  .vr-stat { background: rgba(10,8,60,.6); border: 2px solid rgba(255,255,255,.25); border-radius: 6px; padding: 10px 18px; min-width: 120px; text-align: center;
    transform: skewX(-8deg); }
  .vr-stat .v { font-family: Impact, "Arial Black", sans-serif; font-size: 2rem; color: #ffe46b; text-shadow: 0 3px 0 #1b1260; }
  .vr-stat .k { font-size: .8rem; letter-spacing: .15em; color: #cfd8ff; text-transform: uppercase; font-weight: 700; }
  @keyframes rise { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  .vr-btn { position: relative; margin-top: 30px; font-family: Impact, "Arial Black", sans-serif; font-size: 1.6rem; letter-spacing: .08em; text-transform: uppercase;
    padding: 10px 44px; color: #1a1200; border: 3px solid #fff6c0; border-radius: 6px; cursor: pointer; transform: skewX(-8deg);
    background: linear-gradient(#fff36b, #ffc400); box-shadow: 0 6px 0 #a06a00, 0 10px 24px rgba(0,0,0,.4); animation: rise .5s ease-out both 1.5s; }
  .vr-btn:hover { filter: brightness(1.1); }
  .vr-btn:active { box-shadow: 0 2px 0 #a06a00; translate: 0 4px; }
  .confetti { position: absolute; top: -20px; width: 10px; height: 16px; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translate(var(--drift), 110vh) rotate(var(--spin)); } }
  .fleet { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; min-width: 200px; }
  .fleet-item { display: flex; align-items: center; gap: 8px; font-size: .85rem; padding: 3px 8px; border-radius: 6px; border: 1px solid transparent; }
  .fleet-item .pips { display: flex; gap: 2px; }
  .fleet-item .pip { width: 12px; height: 12px; border-radius: 2px; background: var(--ship); }
  .fleet-item.sunk { opacity: .45; text-decoration: line-through; }
  .fleet-item.sunk .pip { background: var(--hit); }
  .fleet-item.selectable { cursor: pointer; }
  .fleet-item.selectable:hover { border-color: #3c8fd0; }
  .fleet-item.selected { border-color: var(--accent); background: rgba(255,204,51,.12); }
  .fleet-item.placed { opacity: .45; }
  .stats { display: flex; gap: 18px; margin-top: 18px; color: var(--muted); font-size: .9rem; flex-wrap: wrap; justify-content: center; }
  .stats b { color: var(--text); }
  #log { margin: 14px 0 30px; width: min(760px, 94vw); max-height: 120px; overflow-y: auto; font-size: .85rem;
         background: rgba(0,0,0,.25); border-radius: 8px; padding: 8px 12px; color: var(--muted); }
  #log div.you { color: #a8e6ff; } #log div.cpu { color: #ffc2b8; } #log div.big { color: var(--accent); font-weight: 700; }
  .help { font-size: .82rem; color: var(--muted); text-align: center; margin-top: -6px; }
  #overlay { position: fixed; inset: 0; background: rgba(0,10,20,.72); display: none; align-items: center; justify-content: center; z-index: 10; }
  #overlay.show { display: flex; }
  .modal { background: linear-gradient(#103c63, #0a2741); border: 2px solid var(--accent); border-radius: 14px; padding: 28px 40px;
           text-align: center; box-shadow: 0 10px 50px rgba(0,0,0,.6); animation: pop .4s ease-out; }
  .modal h2 { margin: 0 0 8px; font-size: 2.2rem; letter-spacing: .1em; }
  .modal p { color: var(--muted); margin: 6px 0 18px; }
  .shake { animation: shake .35s; }
  @keyframes shake { 0%,100%{transform:translate(0)} 20%{transform:translate(-5px,2px)} 40%{transform:translate(5px,-2px)} 60%{transform:translate(-3px,1px)} 80%{transform:translate(3px,-1px)} }
</style>
</head>
<body>
<header>
  <h1>BATTLESHIP</h1>
  <div id="status">Place your fleet</div>
</header>

<div class="controls">
  <button class="btn" id="rotateBtn">Rotate (R): Horizontal</button>
  <button class="btn" id="randomBtn">Random Placement</button>
  <button class="btn" id="clearBtn">Clear</button>
  <select id="difficulty" title="Computer difficulty">
    <option value="easy">Easy</option>
    <option value="normal">Normal</option>
    <option value="hard" selected>Hard</option>
  </select>
  <button class="btn primary" id="startBtn" disabled>Start Battle</button>
  <button class="btn" id="soundBtn">Sound: On</button>
  <button class="btn" id="cinemaBtn">Sink Videos: On</button>
</div>
<div class="help" id="help">Select a ship, then click your board to place it. Press R (or the Rotate button) to rotate.</div>

<div class="boards">
  <div class="board-wrap" id="playerWrap">
    <h2>YOUR FLEET</h2>
    <div class="board" id="playerBoard"></div>
    <div class="fleet" id="playerFleet"></div>
  </div>
  <div class="board-wrap" id="enemyWrap">
    <h2>ENEMY WATERS</h2>
    <div class="board target" id="enemyBoard"></div>
    <div class="fleet" id="enemyFleet"></div>
  </div>
</div>

<div class="stats">
  <span>Your shots: <b id="pShots">0</b></span>
  <span>Your accuracy: <b id="pAcc">–</b></span>
  <span>CPU shots: <b id="cShots">0</b></span>
  <span>CPU accuracy: <b id="cAcc">–</b></span>
  <span>Record (W–L): <b id="record">0–0</b></span>
</div>
<div id="log"></div>

<div id="cinema" title="Click to skip"><canvas id="cinemaCanvas" width="960" height="540"></canvas></div>

<div id="victory">
  <div class="rays"></div><div class="glow"></div>
  <div class="vr-title">
    <div class="vr-num vr-gold">#1</div>
    <div class="vr-victory vr-gold">Victory</div>
    <div class="vr-royale">Royale</div>
  </div>
  <div class="vr-stats" id="vrStats"></div>
  <button class="vr-btn" id="vrAgainBtn">Play Again</button>
</div>

<div id="overlay"><div class="modal">
  <h2 id="resultTitle">VICTORY</h2>
  <p id="resultText"></p>
  <button class="btn primary" id="againBtn">Play Again</button>
</div></div>

<script>
(() => {
  const N = 10;
  const LETTERS = "ABCDEFGHIJ";
  const SHIPS = [
    { name: "Carrier", size: 5 },
    { name: "Battleship", size: 4 },
    { name: "Cruiser", size: 3 },
    { name: "Submarine", size: 3 },
    { name: "Destroyer", size: 2 },
  ];
  const $ = id => document.getElementById(id);
  const coord = (r, c) => LETTERS[r] + (c + 1);

  // ---------- Sound ----------
  let audioCtx = null, soundOn = true;
  function tone({ freq = 440, end = freq, dur = .2, type = "sine", vol = .2, noise = false }) {
    if (!soundOn) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const t = audioCtx.currentTime, g = audioCtx.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      g.connect(audioCtx.destination);
      if (noise) {
        const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
        const src = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter();
        f.type = "lowpass"; f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(end, t + dur);
        src.buffer = buf; src.connect(f); f.connect(g); src.start(t);
      } else {
        const o = audioCtx.createOscillator();
        o.type = type; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(end, t + dur);
        o.connect(g); o.start(t); o.stop(t + dur);
      }
    } catch (e) {}
  }
  const sfx = {
    miss: () => tone({ freq: 2500, end: 300, dur: .35, noise: true, vol: .25 }),
    hit: () => { tone({ freq: 1800, end: 80, dur: .5, noise: true, vol: .5 }); tone({ freq: 120, end: 40, dur: .4, type: "sine", vol: .4 }); },
    sunk: () => { tone({ freq: 900, end: 40, dur: 1.1, noise: true, vol: .6 }); tone({ freq: 90, end: 30, dur: 1, type: "sawtooth", vol: .15 }); },
    place: () => tone({ freq: 500, end: 700, dur: .08, type: "square", vol: .06 }),
    win: () => {
      tone({ freq: 160, end: 40, dur: .6, noise: true, vol: .5 });
      [[392, 0], [523, 120], [659, 240], [784, 360], [1047, 520], [784, 760], [1047, 880]].forEach(([f, d], i, a) =>
        setTimeout(() => { tone({ freq: f, dur: i === a.length - 1 ? 1.2 : .25, type: "sawtooth", vol: .08 }); tone({ freq: f / 2, dur: i === a.length - 1 ? 1.2 : .25, type: "triangle", vol: .15 }); }, d + 150));
    },
    lose: () => [392, 330, 262, 196].forEach((f, i) => setTimeout(() => tone({ freq: f, dur: .4, type: "triangle", vol: .2 }), i * 200)),
  };

  // ---------- Model ----------
  function makeSide() {
    return {
      grid: Array.from({ length: N }, () => Array(N).fill(-1)),   // ship index or -1
      shots: Array.from({ length: N }, () => Array(N).fill(0)),   // 0 none, 1 miss, 2 hit
      ships: SHIPS.map(s => ({ ...s, cells: [], hits: 0, placed: false, horizontal: true })),
      shotCount: 0, hitCount: 0,
    };
  }
  function canPlace(side, size, r, c, horiz, ignoreIdx = -1) {
    for (let i = 0; i < size; i++) {
      const rr = r + (horiz ? 0 : i), cc = c + (horiz ? i : 0);
      if (rr >= N || cc >= N) return false;
      const g = side.grid[rr][cc];
      if (g !== -1 && g !== ignoreIdx) return false;
    }
    return true;
  }
  function placeShip(side, idx, r, c, horiz) {
    const ship = side.ships[idx];
    removeShip(side, idx);
    ship.cells = [];
    for (let i = 0; i < ship.size; i++) {
      const rr = r + (horiz ? 0 : i), cc = c + (horiz ? i : 0);
      side.grid[rr][cc] = idx; ship.cells.push([rr, cc]);
    }
    ship.placed = true; ship.horizontal = horiz;
  }
  function removeShip(side, idx) {
    const ship = side.ships[idx];
    ship.cells.forEach(([r, c]) => side.grid[r][c] = -1);
    ship.cells = []; ship.placed = false;
  }
  function randomFleet(side) {
    side.ships.forEach((_, i) => removeShip(side, i));
    side.ships.forEach((s, i) => {
      let ok = false;
      while (!ok) {
        const h = Math.random() < .5, r = rand(N), c = rand(N);
        if (canPlace(side, s.size, r, c, h)) { placeShip(side, i, r, c, h); ok = true; }
      }
    });
  }
  const rand = n => Math.floor(Math.random() * n);
  // Returns {result: 'miss'|'hit'|'sunk', shipIdx}
  function fire(side, r, c) {
    side.shotCount++;
    const idx = side.grid[r][c];
    if (idx === -1) { side.shots[r][c] = 1; return { result: "miss" }; }
    side.shots[r][c] = 2; side.hitCount++;
    const ship = side.ships[idx]; ship.hits++;
    return { result: ship.hits === ship.size ? "sunk" : "hit", shipIdx: idx };
  }
  const allSunk = side => side.ships.every(s => s.hits === s.size);

  // ---------- Computer AI ----------
  // Tracks what the computer knows about the player's board.
  function makeAI() {
    return {
      known: Array.from({ length: N }, () => Array(N).fill(0)), // 0 unknown, 1 miss, 2 hit (unsunk), 3 sunk
      remaining: SHIPS.map(s => s.size),
    };
  }
  function aiRecord(ai, r, c, res, side) {
    if (res.result === "miss") ai.known[r][c] = 1;
    else ai.known[r][c] = 2;
    if (res.result === "sunk") {
      const ship = side.ships[res.shipIdx];
      ship.cells.forEach(([rr, cc]) => ai.known[rr][cc] = 3);
      const i = ai.remaining.indexOf(ship.size);
      if (i >= 0) ai.remaining.splice(i, 1);
    }
  }
  function unknownCells(ai) {
    const out = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (ai.known[r][c] === 0) out.push([r, c]);
    return out;
  }
  function pick(arr) { return arr[rand(arr.length)]; }
  const inB = (r, c) => r >= 0 && c >= 0 && r < N && c < N;

  function aiEasy(ai) { return pick(unknownCells(ai)); }

  function aiNormal(ai) {
    const hits = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (ai.known[r][c] === 2) hits.push([r, c]);
    if (hits.length) {
      // Try extending lines of 2+ aligned hits first
      const cands = [];
      for (const [r, c] of hits) {
        for (const [dr, dc] of [[0,1],[1,0]]) {
          if (inB(r+dr, c+dc) && ai.known[r+dr][c+dc] === 2) {
            // walk both directions to ends
            let a = [r, c]; while (inB(a[0]-dr, a[1]-dc) && ai.known[a[0]-dr][a[1]-dc] === 2) a = [a[0]-dr, a[1]-dc];
            let b = [r, c]; while (inB(b[0]+dr, b[1]+dc) && ai.known[b[0]+dr][b[1]+dc] === 2) b = [b[0]+dr, b[1]+dc];
            const e1 = [a[0]-dr, a[1]-dc], e2 = [b[0]+dr, b[1]+dc];
            [e1, e2].forEach(([rr, cc]) => { if (inB(rr, cc) && ai.known[rr][cc] === 0) cands.push([rr, cc]); });
          }

      if (cands.length) return pick(cands);
      const adj = [];
      for (const [r, c] of hits) for (const [dr, dc] of [[0,1],[1,0],[0,-1],[-1,0]]) {
        const rr = r+dr, cc = c+dc;
        if (inB(rr, cc) && ai.known[rr][cc] === 0) adj.push([rr, cc]);
      }
      if (adj.length) return pick(adj);
    }
    const minShip = Math.min(...ai.remaining);
    const parity = unknownCells(ai).filter(([r, c]) => (r + c) % minShip === 0);
    return parity.length ? pick(parity) : aiEasy(ai);

  // Probability density: count every legal placement of each remaining ship.
  function aiHard(ai) {
    const score = Array.from({ length: N }, () => Array(N).fill(0));
    const hasHits = ai.known.some(row => row.includes(2));
    for (const size of ai.remaining) {
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) for (const h of [true, false]) {
        let ok = true, hitsCovered = 0;
        for (let i = 0; i < size; i++) {
          const rr = r + (h ? 0 : i), cc = c + (h ? i : 0);
          if (!inB(rr, cc)) { ok = false; break; }
          const k = ai.known[rr][cc];
          if (k === 1 || k === 3) { ok = false; break; }
          if (k === 2) hitsCovered++;
        }
        if (!ok) continue;
        if (hasHits && hitsCovered === 0) continue; // target mode: only placements through hits
        const w = hasHits ? Math.pow(20, hitsCovered) : 1;
        for (let i = 0; i < size; i++) {
          const rr = r + (h ? 0 : i), cc = c + (h ? i : 0);

    let best = -1, bestCells = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if (ai.known[r][c] !== 0) continue;
      if (score[r][c] > best) { best = score[r][c]; bestCells = [[r, c]]; }
      else if (score[r][c] === best) bestCells.push([r, c]);

  }

  // ---------- Game state ----------
  let player, enemy, ai, phase, selected, horizontal, playerTurn, lastCpuShot, hoverCell;
  const record = JSON.parse(localStorage.getItem("bs-record") || '{"w":0,"l":0}');

  function newGame() {
    player = makeSide(); enemy = makeSide(); ai = makeAI();
    randomFleet(enemy);
    phase = "placing"; selected = 0; horizontal = true; playerTurn = true; lastCpuShot = null; hoverCell = null;
    $("log").innerHTML = "";

    ["rotateBtn", "randomBtn", "clearBtn"].forEach(id => $(id).disabled = false);

  function setStatus(t) { $("status").textContent = t; }

  // ---------- Rendering ----------
  function buildBoard(el, onClick, onHover) {
    el.innerHTML = "";
    el.appendChild(Object.assign(document.createElement("div"), { className: "label" }));
    for (let c = 0; c < N; c++) el.appendChild(Object.assign(document.createElement("div"), { className: "label", textContent: c + 1 }));
    for (let r = 0; r < N; r++) {
      el.appendChild(Object.assign(document.createElement("div"), { className: "label", textContent: LETTERS[r] }));
      for (let c = 0; c < N; c++) {

        cell.className = "cell"; cell.dataset.r = r; cell.dataset.c = c;
        cell.addEventListener("click", () => onClick(r, c));

  const cellEl = (board, r, c) => board.children[(r + 1) * (N + 1) + c + 1];

  function shipShapeClasses(ship, r, c) {

  function render() {

    eb.classList.toggle("enabled", phase === "battle" && playerTurn);
    // Player board
    let preview = null;
    if (phase === "placing" && hoverCell && selected !== null) {
      const s = player.ships[selected];
      preview = { ok: canPlace(player, s.size, hoverCell[0], hoverCell[1], horizontal, selected), cells: [] };
      for (let i = 0; i < s.size; i++) {
        const rr = hoverCell[0] + (horizontal ? 0 : i), cc = hoverCell[1] + (horizontal ? i : 0);
        if (inB(rr, cc)) preview.cells.push(rr * N + cc);

    }

      const el = cellEl(pb, r, c), idx = player.grid[r][c], shot = player.shots[r][c];
      const cls = ["cell"];

        if (player.ships[idx].hits === player.ships[idx].size) cls.push("sunk");

      if (shot === 1) cls.push("miss"); if (shot === 2) cls.push("hit");
      if (preview && preview.cells.includes(r * N + c)) cls.push(preview.ok ? "preview-ok" : "preview-bad");
      if (lastCpuShot && lastCpuShot[0] === r && lastCpuShot[1] === c) cls.push("last");
      setCls(el, cls);
    }
    // Enemy board
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const el = cellEl(eb, r, c), idx = enemy.grid[r][c], shot = enemy.shots[r][c];
      const cls = ["cell"];
      const ship = idx !== -1 ? enemy.ships[idx] : null;
      const revealed = ship && (ship.hits === ship.size || phase === "over");
      if (revealed) { cls.push(...shipShapeClasses(ship, r, c)); if (ship.hits === ship.size) cls.push("sunk"); }
      if (shot === 1) cls.push("miss"); else if (shot === 2) cls.push("hit"); else cls.push("open");

    renderFleet($("enemyFleet"), enemy, false);

    $("enemyWrap").classList.toggle("active", phase === "battle" && playerTurn);

    $("rotateBtn").textContent = "Rotate (R): " + (horizontal ? "Horizontal" : "Vertical");
    $("pShots").textContent = enemy.shotCount;
    $("pAcc").textContent = enemy.shotCount ? Math.round(100 * enemy.hitCount / enemy.shotCount) + "%" : "–";
    $("cShots").textContent = player.shotCount;
    $("cAcc").textContent = player.shotCount ? Math.round(100 * player.hitCount / player.shotCount) + "%" : "–";

  }
  function setCls(el, cls) { const s = cls.join(" "); if (el.className !== s) el.className = s; }

  function renderFleet(el, side, isPlayer) {
    el.innerHTML = "";
    side.ships.forEach((s, i) => {
      const item = document.createElement("div");
      item.className = "fleet-item";
      const sunk = s.hits === s.size;
      if (sunk) item.classList.add("sunk");
      if (isPlayer && phase === "placing") {
        item.classList.add("selectable");
        if (s.placed) item.classList.add("placed");
        if (selected === i) item.classList.add("selected");
        item.onclick = () => { selected = i; render(); };
      }
      const pips = document.createElement("span"); pips.className = "pips";

      item.appendChild(pips);

  }

  // ---------- Placement ----------
  function onPlayerClick(r, c) {
    if (phase !== "placing") return;
    if (selected === null) {
      // clicking a placed ship picks it back up
      const idx = player.grid[r][c];
      if (idx !== -1) { selected = idx; horizontal = player.ships[idx].horizontal; render(); }
      return;
    }
    const s = player.ships[selected];
    if (!canPlace(player, s.size, r, c, horizontal, selected)) {
      const idx = player.grid[r][c];
      if (idx !== -1 && idx !== selected) { selected = idx; horizontal = player.ships[idx].horizontal; render(); }
      return;
    }
    placeShip(player, selected, r, c, horizontal);
    sfx.place();
    const next = player.ships.findIndex(sh => !sh.placed);
    selected = next === -1 ? null : next;
    if (next === -1) setStatus("Fleet ready — press Start Battle!");
    render();
  }
  function onPlayerHover(r, c) {
    if (phase !== "placing") return;
    hoverCell = r === null ? null : [r, c];
    render();
  }
  function rotate() { if (phase === "placing") { horizontal = !horizontal; render(); } }

  // ---------- Battle ----------
  function startBattle() {
    if (!player.ships.every(s => s.placed)) return;
    phase = "battle"; playerTurn = true; selected = null; hoverCell = null;
    ["rotateBtn", "randomBtn", "clearBtn"].forEach(id => $(id).disabled = true);
    $("difficulty").disabled = true;
    $("help").style.display = "none";
    setStatus("Your turn — fire on enemy waters!");
    log("Battle started on " + $("difficulty").value.toUpperCase() + " difficulty.", "big");
    render();
  }

  function onEnemyClick(r, c) {
    if (phase !== "battle" || !playerTurn || enemy.shots[r][c]) return;
    const res = fire(enemy, r, c);
    if (res.result === "miss") { sfx.miss(); log(`You fire at ${coord(r, c)} — miss.`, "you"); }
    else if (res.result === "hit") { sfx.hit(); explode("enemyBoard", r, c); log(`You fire at ${coord(r, c)} — HIT!`, "you"); }
    else { sfx.sunk(); explode("enemyBoard", r, c, true); shake("enemyBoard"); log(`You fire at ${coord(r, c)} — you sank their ${enemy.ships[res.shipIdx].name}!`, "big"); }
    playerTurn = false;
    const won = allSunk(enemy);
    setStatus(res.result === "miss" ? "Miss. Enemy is aiming..." :
      res.result === "hit" ? "Hit! Enemy is aiming..." :
      `Sunk their ${enemy.ships[res.shipIdx].name}!` + (won ? "" : " Enemy is aiming..."));
    render();
    const proceed = () => won ? endGame(true) : setTimeout(cpuTurn, 850);
    if (res.result === "sunk") playSinking(enemy.ships[res.shipIdx], true, proceed);
    else proceed();
  }

  function cpuTurn() {
    if (phase !== "battle") return;
    const diff = $("difficulty").value;
    const [r, c] = diff === "easy" ? aiEasy(ai) : diff === "normal" ? aiNormal(ai) : aiHard(ai);
    const res = fire(player, r, c);
    aiRecord(ai, r, c, res, player);
    lastCpuShot = [r, c];
    if (res.result === "miss") { sfx.miss(); log(`Enemy fires at ${coord(r, c)} — miss.`, "cpu"); }
    else if (res.result === "hit") { sfx.hit(); explode("playerBoard", r, c); shake("playerBoard"); log(`Enemy fires at ${coord(r, c)} — HIT!`, "cpu"); }
    else { sfx.sunk(); explode("playerBoard", r, c, true); shake("playerBoard"); log(`Enemy fires at ${coord(r, c)} — they sank your ${player.ships[res.shipIdx].name}!`, "big"); }
    const msg = res.result === "miss" ? `Enemy missed at ${coord(r, c)}.` :
      res.result === "hit" ? `Enemy hit you at ${coord(r, c)}!` : `Enemy sank your ${player.ships[res.shipIdx].name}!`;
    const proceed = () => {
      if (allSunk(player)) return endGame(false);
      playerTurn = true;
      setStatus(msg + " Your turn.");
      render();
    };
    render();
    if (res.result === "sunk") { setStatus(msg); playSinking(player.ships[res.shipIdx], false, proceed); }
    else proceed();
  }

  // ---------- Ship-sinking cinematic ----------
  let cinemaOn = true;
  function playSinking(ship, isEnemy, done) {
    if (!cinemaOn) return done();
    const ov = $("cinema"), cv = $("cinemaCanvas"), ctx = cv.getContext("2d");
    const W = cv.width, H = cv.height, WATER = H * 0.62, DUR = 3.6;
    const L = 160 + ship.size * 70;
    const caption = (isEnemy ? "ENEMY " : "YOUR ") + ship.name.toUpperCase() + " SUNK";
    const hullCol = isEnemy ? "#3b4249" : "#6f7d8a", deckCol = isEnemy ? "#4d565e" : "#8b99a6";
    const smoke = [], fire = [], bubbles = [], drops = [];
    let start = null, finished = false, last = 0, groaned = false;
    const clamp = v => Math.max(0, Math.min(1, v));
    const ease = v => v * v * (3 - 2 * v);
    const wave = (x, t, a = 1) => Math.sin(x * 0.012 + t * 1.6) * 5 * a + Math.sin(x * 0.031 - t * 2.3) * 2.5 * a;

    for (let i = 0; i < 40; i++) {
      const a = -Math.PI / 2 + (Math.random() - .5) * 1.6, sp = 200 + Math.random() * 300;
      drops.push({ x: W / 2 + (Math.random() - .5) * 60, y: WATER - 30, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1 });
    }

    function shipState(t) {
      const p = ease(clamp((t - 0.6) / 2.6));
      return {
        p,
        x: W / 2 - p * 30,
        y: WATER + 6 + Math.sin(t * 2) * 3 + Math.pow(p, 1.6) * (H * 0.55),
        a: -p * 0.5 + Math.sin(t * 1.7) * 0.02,
      };
    }
    function toWorld(s, lx, ly) {
      const c = Math.cos(s.a), n = Math.sin(s.a);
      return [s.x + lx * c - ly * n, s.y + lx * n + ly * c];
    }
    function drawShip(s) {
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.a);
      const h = L / 2;
      // hull
      ctx.fillStyle = hullCol;
      ctx.beginPath(); ctx.moveTo(-h, -22); ctx.lineTo(h + 26, -28); ctx.lineTo(h - 14, 26); ctx.lineTo(-h + 14, 26); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#7a1d16";
      ctx.beginPath(); ctx.moveTo(-h + 6, 8); ctx.lineTo(h + 1, 8); ctx.lineTo(h - 14, 26); ctx.lineTo(-h + 14, 26); ctx.closePath(); ctx.fill();
      ctx.fillStyle = deckCol; ctx.fillRect(-h, -26, L + 20, 5);
      // superstructure
      ctx.fillStyle = deckCol;
      ctx.fillRect(-L * 0.16, -54, L * 0.3, 30);
      ctx.fillRect(-L * 0.04, -76, L * 0.14, 24);
      ctx.fillStyle = "#cfe3f5"; for (let i = 0; i < 4; i++) ctx.fillRect(-L * 0.03 + i * L * 0.03, -70, L * 0.018, 6);
      ctx.fillStyle = hullCol; ctx.fillRect(-L * 0.1, -92, 20, 40);
      ctx.fillStyle = "#222"; ctx.fillRect(-L * 0.1, -94, 20, 6);
      ctx.strokeStyle = hullCol; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(L * 0.05, -76); ctx.lineTo(L * 0.05, -112); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(L * 0.05 - 12, -102); ctx.lineTo(L * 0.05 + 12, -102); ctx.stroke();
      // turrets
      const turrets = ship.size >= 4 ? [-0.36, 0.3, 0.42] : ship.size === 3 ? [-0.34, 0.34] : [0.34];
      turrets.forEach(f => {
        ctx.fillStyle = deckCol; ctx.beginPath(); ctx.ellipse(L * f, -30, 18, 10, 0, Math.PI, 0); ctx.fill();
        ctx.strokeStyle = "#2a2f34"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(L * f, -36); ctx.lineTo(L * f + (f > 0 ? 34 : -34), -42); ctx.stroke();
      });
      // scorch marks
      ctx.fillStyle = "rgba(0,0,0,.45)";
      [[-0.25, -8], [0.1, -2], [0.3, -12]].forEach(([f, y]) => { ctx.beginPath(); ctx.ellipse(L * f, y, 18, 9, 0.3, 0, Math.PI * 2); ctx.fill(); });
      ctx.restore();
    }

    function frame(ts) {
      if (finished) return;
      if (start === null) { start = ts; last = ts; }
      const t = (ts - start) / 1000, dt = Math.min(0.05, (ts - last) / 1000); last = ts;
      const s = shipState(t);

      // sky
      const sky = ctx.createLinearGradient(0, 0, 0, WATER);
      sky.addColorStop(0, "#1a1430"); sky.addColorStop(0.6, "#7a3b3b"); sky.addColorStop(1, "#e08a4a");
      ctx.fillStyle = sky; ctx.fillRect(0, 0, W, WATER);
      ctx.fillStyle = "rgba(255,200,120,.85)"; ctx.beginPath(); ctx.arc(W * 0.8, WATER - 30, 46, 0, Math.PI * 2); ctx.fill();
      // sea
      const sea = ctx.createLinearGradient(0, WATER, 0, H);
      sea.addColorStop(0, "#1d4e6e"); sea.addColorStop(1, "#04121f");
      ctx.fillStyle = sea; ctx.fillRect(0, WATER - 10, W, H - WATER + 10);
      // submerged part (faint)
      ctx.save(); ctx.beginPath(); ctx.rect(0, WATER, W, H); ctx.clip(); ctx.globalAlpha = 0.22; drawShip(s); ctx.restore();
      // visible part above the water
      ctx.save(); ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(W, 0);
      for (let x = W; x >= 0; x -= 16) ctx.lineTo(x, WATER + wave(x, t));
      ctx.closePath(); ctx.clip(); drawShip(s); ctx.restore();
      // wave surface lines
      ctx.strokeStyle = "rgba(180,220,255,.35)"; ctx.lineWidth = 2;
      for (let k = 0; k < 4; k++) {
        ctx.beginPath();
        for (let x = 0; x <= W; x += 12) { const y = WATER + k * 26 + wave(x + k * 90, t + k, 1 - k * 0.2); x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
        ctx.stroke();
      }

      ctx.fillStyle = "rgba(230,245,255,.5)";
      for (let i = 0; i < 10; i++) {
        const fx = s.x + (i - 5) * (L / 9) * (1 - s.p * 0.7);
        ctx.beginPath(); ctx.ellipse(fx, WATER + wave(fx, t) + 2, 22 * (1 - s.p * 0.5), 5, 0, 0, Math.PI * 2); ctx.fill();
      }

      // emitters
      const funnel = toWorld(s, -L * 0.1 + 10, -94);
      if (funnel[1] < WATER) for (let i = 0; i < 2; i++) smoke.push({ x: funnel[0], y: funnel[1], r: 10, vx: -30 + Math.random() * 20, vy: -60 - Math.random() * 30, life: 1 });
      for (let i = 0; i < 4; i++) {
        const fp = toWorld(s, (Math.random() - .5) * L, -26);
        if (fp[1] < WATER - 4) fire.push({ x: fp[0], y: fp[1], vx: (Math.random() - .5) * 30, vy: -80 - Math.random() * 80, life: 1 });
      }
      if (s.p > 0.45) for (let i = 0; i < 3; i++) bubbles.push({ x: s.x + (Math.random() - .5) * L * 0.5, y: WATER + 40 + Math.random() * (H - WATER - 40), r: 2 + Math.random() * 5, vy: -40 - Math.random() * 60 });
      if (s.p > 0.3 && !groaned) { groaned = true; tone({ freq: 70, end: 35, dur: 1.6, type: "sawtooth", vol: .12 }); }

      // particles
      smoke.forEach(q => { q.x += q.vx * dt; q.y += q.vy * dt; q.r += 26 * dt; q.life -= dt * 0.5; });
      fire.forEach(q => { q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt * 2.2; });
      bubbles.forEach(q => { q.y += q.vy * dt; q.x += Math.sin(q.y * 0.05) * 0.5; });
      drops.forEach(q => { q.vy += 700 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt * 0.9; });
      for (const arr of [smoke, fire, drops]) for (let i = arr.length - 1; i >= 0; i--) if (arr[i].life <= 0) arr.splice(i, 1);
      for (let i = bubbles.length - 1; i >= 0; i--) if (bubbles[i].y < WATER) bubbles.splice(i, 1);

      ctx.save();
      ctx.strokeStyle = "rgba(200,235,255,.6)"; ctx.lineWidth = 1.5;
      bubbles.forEach(q => { ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.stroke(); });
      smoke.forEach(q => { ctx.fillStyle = `rgba(40,38,40,${0.45 * q.life})`; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fill(); });
      ctx.globalCompositeOperation = "lighter";
      fire.forEach(q => {
        const g = ctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, 16);
        g.addColorStop(0, `rgba(255,240,150,${q.life})`); g.addColorStop(0.5, `rgba(255,120,20,${0.7 * q.life})`); g.addColorStop(1, "rgba(255,40,0,0)");
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(q.x, q.y, 16, 0, Math.PI * 2); ctx.fill();
      });
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "rgba(220,240,255,.8)";
      drops.forEach(q => { ctx.beginPath(); ctx.arc(q.x, q.y, 3, 0, Math.PI * 2); ctx.fill(); });
      ctx.restore();

      // initial flash
      if (t < 0.25) { ctx.fillStyle = `rgba(255,230,180,${0.7 * (1 - t / 0.25)})`; ctx.fillRect(0, 0, W, H); }

      // letterbox + caption
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, 44); ctx.fillRect(0, H - 44, W, 44);
      const ca = clamp((t - 0.8) / 0.4) * clamp((DUR - t) / 0.3);
      ctx.textAlign = "center";
      ctx.font = "800 54px 'Segoe UI', system-ui, sans-serif";
      ctx.fillStyle = `rgba(0,0,0,${0.6 * ca})`; ctx.fillText(caption, W / 2 + 3, 133);
      ctx.fillStyle = isEnemy ? `rgba(255,204,51,${ca})` : `rgba(255,90,70,${ca})`; ctx.fillText(caption, W / 2, 130);
      ctx.font = "600 16px 'Segoe UI', system-ui, sans-serif"; ctx.fillStyle = "rgba(255,255,255,.5)";
      ctx.fillText("click or press any key to skip", W / 2, H - 16);
      // fade out
      if (t > DUR - 0.4) { ctx.fillStyle = `rgba(0,0,0,${clamp((t - (DUR - 0.4)) / 0.4)})`; ctx.fillRect(0, 0, W, H); }

      if (t >= DUR) return finish();
      requestAnimationFrame(frame);
    }
    function finish() {
      if (finished) return;
      finished = true;
      ov.classList.remove("show");
      ov.onclick = null; document.removeEventListener("keydown", onKey, true);
      done();
    }
    function onKey(e) { e.preventDefault(); e.stopPropagation(); finish(); }
    ov.onclick = finish;
    document.addEventListener("keydown", onKey, true);
    ov.classList.add("show");
    setTimeout(() => requestAnimationFrame(frame), 250);
  }

  function explode(boardId, r, c, big) {
    const cell = cellEl($(boardId), r, c);
    const ex = document.createElement("div");
    ex.className = "explosion" + (big ? " big" : "");
    ex.innerHTML = '<div class="smoke"></div><div class="core"></div><div class="ring"></div>';
    const sparks = big ? 14 : 8, dist = big ? 1.6 : 1;
    for (let i = 0; i < sparks; i++) {
      const a = (i / sparks) * Math.PI * 2 + Math.random() * .4, d = (18 + Math.random() * 14) * dist;
      const sp = document.createElement("div");
      sp.className = "spark";
      sp.style.setProperty("--dx", Math.cos(a) * d + "px");
      sp.style.setProperty("--dy", Math.sin(a) * d + "px");
      ex.appendChild(sp);
    }
    cell.appendChild(ex);
    setTimeout(() => ex.remove(), 1200);
  }

  function shake(id) {
    const el = $(id); el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
  }

  function endGame(won) {
    phase = "over";
    if (won) record.w++; else record.l++;
    localStorage.setItem("bs-record", JSON.stringify(record));
    render();
    setStatus(won ? "Victory! The enemy fleet is destroyed." : "Defeat. Your fleet has been sunk.");
    log(won ? "VICTORY!" : "DEFEAT.", "big");
    setTimeout(() => {
      if (won) return showVictoryRoyale();
      (won ? sfx.win : sfx.lose)();
      $("resultTitle").textContent = won ? "VICTORY" : "DEFEAT";
      $("resultTitle").style.color = won ? "var(--accent)" : "var(--hit)";
      const acc = Math.round(100 * enemy.hitCount / enemy.shotCount);
      $("resultText").textContent = won
        ? `You sank the enemy fleet in ${enemy.shotCount} shots (${acc}% accuracy).`
        : `The computer sank your fleet in ${player.shotCount} shots. You hit ${enemy.hitCount} of 17 enemy squares.`;
      $("overlay").classList.add("show");
    }, 900);
  }

  function showVictoryRoyale() {
    sfx.win();
    const acc = Math.round(100 * enemy.hitCount / enemy.shotCount);
    const left = player.ships.filter(sh => sh.hits < sh.size).length;
    const stats = [["Placed", "#1"], ["Eliminations", enemy.ships.length], ["Shots", enemy.shotCount], ["Accuracy", acc + "%"], ["Ships Left", left]];
    $("vrStats").innerHTML = stats.map(([k, v]) => `<div class="vr-stat"><div class="v">${v}</div><div class="k">${k}</div></div>`).join("");
    const v = $("victory");
    v.querySelectorAll(".confetti").forEach(e => e.remove());
    // restart CSS entrance animations
    v.querySelectorAll(".vr-title, .vr-royale, .vr-stats, .vr-btn").forEach(e => { e.style.animation = "none"; void e.offsetWidth; e.style.animation = ""; });
    const colors = ["#ffe46b", "#ff4fd8", "#4fd2ff", "#7cff6b", "#ff8a00", "#ffffff", "#b06bff"];
    for (let i = 0; i < 140; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw";
      c.style.background = colors[i % colors.length];
      c.style.width = 6 + Math.random() * 8 + "px";
      c.style.height = 10 + Math.random() * 10 + "px";
      c.style.setProperty("--drift", (Math.random() - .5) * 300 + "px");
      c.style.setProperty("--spin", (Math.random() * 1440 - 720) + "deg");
      c.style.animationDuration = 2.5 + Math.random() * 3 + "s";
      c.style.animationDelay = .4 + Math.random() * 1.5 + "s";
      v.appendChild(c);
    }
    v.classList.add("show");
  }

  // ---------- Wire up ----------
  buildBoard($("playerBoard"), onPlayerClick, onPlayerHover);
  buildBoard($("enemyBoard"), onEnemyClick);
  $("rotateBtn").onclick = rotate;
  $("randomBtn").onclick = () => { randomFleet(player); selected = null; setStatus("Fleet ready — press Start Battle!"); render(); };
  $("clearBtn").onclick = () => { player = makeSide(); selected = 0; setStatus("Place your fleet"); render(); };
  $("startBtn").onclick = startBattle;
  $("againBtn").onclick = newGame;
  $("vrAgainBtn").onclick = () => { $("victory").classList.remove("show"); newGame(); };
  $("cinemaBtn").onclick = () => { cinemaOn = !cinemaOn; $("cinemaBtn").textContent = "Sink Videos: " + (cinemaOn ? "On" : "Off"); };
  $("soundBtn").onclick = () => { soundOn = !soundOn; $("soundBtn").textContent = "Sound: " + (soundOn ? "On" : "Off"); };
  document.addEventListener("keydown", e => { if (e.key === "r" || e.key === "R") rotate(); });
  $("playerBoard").addEventListener("contextmenu", e => { if (phase === "placing") { e.preventDefault(); rotate(); } });
  newGame();
})();
</script>
</body>
</html>
